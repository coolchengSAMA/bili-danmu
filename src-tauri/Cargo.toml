[package]
name = "bili-danmu"
version = "1.4.1"
description = "轻量级 B 站直播弹幕助手"
license = "GPL-3.0"
edition = "2021"

[lib]
name = "bili_danmu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# 全局快捷键（发送框显示/隐藏）：应用没焦点时也要能响应，只能走系统级热键。
# 用 ~2.3 钉住次版本（2.3.2 要求 tauri 2.10，与本仓锁定的 2.11.5 兼容）：2.4 起要求
# tauri ^2.12，会把 lock 里的 tauri 顶到 2.12，而 npm 侧 @tauri-apps/api 还是 2.11 ——
# Tauri CLI 会因「大小版本不一致」拒绝打包。
tauri-plugin-global-shortcut = "~2.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", features = ["json", "gzip"] }
md-5 = "0.10"
sha2 = "0.10"
futures-util = "0.3"
brotli-decompressor = "4"
flate2 = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Media_Multimedia", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
